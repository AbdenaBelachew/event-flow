<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Organizer Dashboard — TicketGate</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> TicketGate Organizer</div>
    <div class="nav">
      <a href="/">🛒 Buy Tickets</a>
      <a href="/scanner.html">📱 Gate Scanner</a>
    </div>
  </div>

  <div class="container">

    <!-- Login Screen -->
    <div id="loginCard" class="card" style="max-width:420px;margin:60px auto">
      <div style="text-align:center;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:20px">
        <div style="font-size:48px;margin-bottom:8px">🔐</div>
        <h2 style="margin:0">Admin Sign In</h2>
        <p class="muted small" style="margin-top:6px">Access your event management dashboard</p>
      </div>
      <label>Email address</label><input id="email" value="admin@addisevents.et" type="email" />
      <label>Password</label><input id="password" type="password" value="Password123!" />
      <button class="btn block" onclick="login()" style="margin-top:20px">Sign In</button>
      <p class="muted small" id="loginMsg" style="margin-top:12px;text-align:center"></p>
    </div>

    <!-- Main Dashboard -->
    <div id="main" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
        <div>
          <h1 style="margin:0">📊 Events</h1>
          <p class="muted small" id="companyName" style="margin:6px 0 0"></p>
        </div>
        <button class="btn secondary" onclick="logout()">Sign out</button>
      </div>
      <div id="events"></div>
      <div id="detail"></div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('token'); 
    let me = null;
    
    function authH(){ return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}; }

    async function login(){
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      
      if(!email || !password) {
        document.getElementById('loginMsg').textContent = 'Please enter email and password';
        return;
      }
      
      try {
        const res = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
        const data = await res.json();
        if(!res.ok){ 
          document.getElementById('loginMsg').textContent = data.error||'Login failed. Check your credentials.'; 
          return; 
        }
        token = data.token; 
        localStorage.setItem('token',token); 
        init();
      } catch(e) {
        document.getElementById('loginMsg').textContent = 'Connection error. Try again.';
      }
    }

    function logout(){ 
      token=null; 
      localStorage.removeItem('token'); 
      render(); 
    }

    function render(){ 
      document.getElementById('loginCard').style.display=token?'none':'block'; 
      document.getElementById('main').style.display=token?'block':'none'; 
    }

    async function init(){
      render();
      try {
        const meRes = await fetch('/api/auth/me',{headers:authH()});
        if(!meRes.ok){ logout(); return; }
        me = (await meRes.json()).user;
        document.getElementById('companyName').textContent = me.company_name || 'Your Company';
        
        const res = await fetch('/api/companies/'+me.company_id+'/events',{headers:authH()});
        const data = await res.json();
        const wrap=document.getElementById('events'); 
        wrap.innerHTML='';
        
        if(!data.events || !data.events.length){ 
          wrap.innerHTML='<div class="card muted" style="text-align:center;padding:40px"><p>No events yet</p><p class="small">Events appear here once you create them</p></div>'; 
          return; 
        }
        
        data.events.forEach(e=>{
          const el=document.createElement('div'); 
          el.className='card';
          const pct = e.tickets_total > 0 ? Math.round((e.tickets_sold / e.tickets_total) * 100) : 0;
          const saleStatus = e.status === 'published' ? '🟢 Published' : (e.status === 'draft' ? '⚪ Draft' : '🔴 Archived');
          
          el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:12px">
            <div style="flex:1">
              <h2 style="margin:0;font-size:18px">${e.title}</h2>
              <div class="muted small" style="margin-top:4px">${new Date(e.event_start).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
            </div>
            <span class="badge ${e.status==='published'?'on':'off'}">${saleStatus}</span>
          </div>
          
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0">
            <div class="stat">
              <div class="n">${e.tickets_sold}</div>
              <div class="l">Sold</div>
            </div>
            <div class="stat">
              <div class="n">${e.tickets_total}</div>
              <div class="l">Capacity</div>
            </div>
            <div class="stat">
              <div class="n">${pct}%</div>
              <div class="l">Fill</div>
            </div>
          </div>
          
          <div style="margin-top:12px;background:var(--surface-2);border-radius:8px;height:6px;overflow:hidden">
            <div style="height:100%;background:var(--primary);width:${pct}%;transition:width 0.3s"></div>
          </div>
          
          <div style="display:flex;gap:8px;margin-top:14px">
            <a class="btn secondary" href="/?event=${e.id}" style="flex:1;text-align:center;text-decoration:none">👁️ Preview</a>
            <button class="btn" onclick="openEvent('${e.id}')" style="flex:1">📈 Stats</button>
          </div>`;
          wrap.appendChild(el);
        });
      } catch(e) {
        console.error('Error loading dashboard:', e);
        document.getElementById('events').innerHTML='<div class="card" style="color:var(--danger)">Error loading events. Please try again.</div>';
      }
    }

    async function openEvent(id){
      try {
        const [stats, feed] = await Promise.all([
          fetch('/api/events/'+id+'/stats',{headers:authH()}).then(r=>r.json()),
          fetch('/api/events/'+id+'/check-ins?limit=25',{headers:authH()}).then(r=>r.json())
        ]);
        
        const d=document.getElementById('detail');
        d.innerHTML=`<div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <h2 style="margin:0">📈 Live stats</h2>
            <button class="btn secondary" onclick="closeDetail()">Close</button>
          </div>
          
          <div class="grid-stats" style="margin-top:14px">
            <div class="stat"><div class="n">${stats.sold}</div><div class="l">Sold</div></div>
            <div class="stat"><div class="n">${Number(stats.revenue_etb).toLocaleString()}</div><div class="l">Revenue ETB</div></div>
            <div class="stat"><div class="n">${stats.checked_in}</div><div class="l">Checked in</div></div>
            <div class="stat"><div class="n">${Math.round(stats.no_show_rate*100)}%</div><div class="l">No-show</div></div>
          </div>
          
          <h3 style="margin-top:20px;margin-bottom:10px">📋 By ticket type</h3>
          <table><thead><tr><th>Type</th><th>Sold</th><th>Capacity</th><th>Revenue</th></tr></thead><tbody>
            ${stats.by_ticket_type.map(t=>`<tr><td>${t.name}</td><td>${t.quantity_sold}</td><td>${t.quantity_total}</td><td>${Number(t.revenue_etb).toLocaleString()} ETB</td></tr>`).join('')}
          </tbody></table>
          
          <h3 style="margin-top:20px;margin-bottom:10px">🎟️ Recent check-ins</h3>
          <table><thead><tr><th>Ticket</th><th>Holder</th><th>Result</th><th>Scanned By</th><th>Time</th></tr></thead><tbody>
            ${(feed.check_ins||[]).map(c=>`<tr><td class="code">${c.ticket_code}</td><td>${c.holder_name||'—'}</td><td>${c.result}</td><td>${c.scanned_by_name||'—'}</td><td class="muted small">${new Date(c.scanned_at).toLocaleTimeString()}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No check-ins yet</td></tr>'}
          </tbody></table>
          
          <div style="margin-top:16px">
            <a class="btn secondary block" href="/api/events/${id}/export?_t=${Date.now()}" onclick="return exportCsv(event,'${id}')">⬇️ Export CSV</a>
          </div>
        </div>`;
        d.scrollIntoView({behavior:'smooth'});
      } catch(e) {
        console.error('Error loading event stats:', e);
        document.getElementById('detail').innerHTML='<div class="card" style="color:var(--danger)">Error loading stats. Try again.</div>';
      }
    }

    function closeDetail(){
      document.getElementById('detail').innerHTML='';
    }

    async function exportCsv(ev, id){
      ev.preventDefault();
      try {
        const res = await fetch('/api/events/'+id+'/export',{headers:authH()});
        const blob = await res.blob();
        const a=document.createElement('a'); 
        a.href=URL.createObjectURL(blob); 
        a.download='attendees.csv'; 
        a.click();
      } catch(e) {
        alert('Failed to export. Try again.');
      }
      return false;
    }

    if(token) init(); else render();
  </script>
</body>
</html>
