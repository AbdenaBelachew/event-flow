<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tickets — TicketGate</title>
  <link rel="stylesheet" href="/style.css" />
  <meta http-equiv="refresh" content="0; url=/tickets.html" />
  <script>
    // Forward any existing ?id=... or ?code=... query string to /tickets.html
    const p = new URLSearchParams(location.search);
    const id = p.get('id');
    const code = p.get('code');
    if (id)   location.replace('/tickets.html?id=' + encodeURIComponent(id));
    else if (code) location.replace('/tickets.html?code=' + encodeURIComponent(code));
    else      location.replace('/tickets.html');
  </script>
</head>
<body>
  <div class="container">
    <p class="muted">Redirecting to <a href="/tickets.html">/tickets.html</a>…</p>
  </div>
</body>
</html>
