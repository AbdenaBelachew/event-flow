<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buy Tickets — Ticketing</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> TicketGate</div>
    <div class="nav">
      <a href="/scanner.html">Scanner</a>
      <a href="/dashboard.html">Dashboard</a>
    </div>
  </div>

  <div class="container">
    <div id="picker" class="card">
      <h2>Open an event</h2>
      <p class="muted small">Paste an event ID (see it printed by <code>npm run seed</code>, or the dashboard).</p>
      <label>Event ID</label>
      <input id="eventIdInput" placeholder="e.g. 3f2a...-...." />
      <div style="margin-top:12px"><button class="btn" onclick="go()">Load event</button></div>
    </div>

    <div id="eventView" style="display:none">
      <img id="cover" class="cover" alt="" style="display:none" />
      <h1 id="title"></h1>
      <p class="muted" id="meta"></p>
      <div class="pill-row"><span id="saleBadge" class="badge"></span></div>
      <p id="desc" class="muted" style="margin-top:12px"></p>

      <div class="card">
        <h2>Select tickets</h2>
        <div id="tiers"></div>
      </div>

      <div class="card">
        <h2>Your details</h2>
        <div class="row">
          <div><label>Full name</label><input id="buyerName" /></div>
          <div><label>Phone</label><input id="buyerPhone" placeholder="+2519..." /></div>
        </div>
        <label>Email</label><input id="buyerEmail" type="email" />
        <label>Payment method</label>
        <select id="gateway">
          <option value="chapa">Chapa</option>
          <option value="telebirr">Telebirr</option>
          <option value="cbe_birr">CBE Birr</option>
        </select>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px">
          <div class="total">Total: <span class="etb" id="total">0.00 ETB</span></div>
          <button class="btn" id="payBtn" onclick="checkout()">Pay & get tickets</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script>
    let EVENT = null; let TYPES = []; const qty = {};

    function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2600); }
    function money(n){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:2}) + ' ETB'; }

    function go(){ const id=document.getElementById('eventIdInput').value.trim(); if(id) location.search='?event='+encodeURIComponent(id); }

    async function load(id){
      const res = await fetch('/api/events/'+id+'/availability');
      if(!res.ok){ toast('Event not found'); return; }
      const data = await res.json();
      EVENT = data.event; TYPES = data.ticket_types;
      document.getElementById('picker').style.display='none';
      document.getElementById('eventView').style.display='block';
      document.getElementById('title').textContent = EVENT.title;
      document.getElementById('meta').textContent = [EVENT.venue, EVENT.city].filter(Boolean).join(' · ') + ' · ' + new Date(EVENT.event_start).toLocaleString();
      document.getElementById('desc').textContent = EVENT.description || '';
      if(EVENT.cover_image_url){ const c=document.getElementById('cover'); c.src=EVENT.cover_image_url; c.style.display='block'; }
      const b=document.getElementById('saleBadge');
      b.textContent = data.on_sale ? 'On sale' : 'Sales closed';
      b.className = 'badge ' + (data.on_sale ? 'on' : 'off');

      const wrap=document.getElementById('tiers'); wrap.innerHTML='';
      TYPES.forEach(t=>{
        qty[t.id]=0;
        const el=document.createElement('div'); el.className='tier';
        const soldTxt = t.sold_out ? 'Sold out' : (t.remaining + ' left');
        el.innerHTML = `<div><div class="name">${t.name}</div><div class="muted small">${soldTxt}</div></div>
          <div style="display:flex;align-items:center;gap:16px">
            <div class="price">${money(t.price_etb)}</div>
            <div class="qty">
              <button class="btn secondary" ${!t.on_sale?'disabled':''} onclick="bump('${t.id}',-1)">−</button>
              <input id="q_${t.id}" value="0" readonly />
              <button class="btn secondary" ${!t.on_sale?'disabled':''} onclick="bump('${t.id}',1,${t.max_per_order},${t.remaining})">+</button>
            </div>
          </div>`;
        wrap.appendChild(el);
      });
      recalc();
    }

    function bump(id,d,max,rem){
      const next=(qty[id]||0)+d;
      if(next<0) return;
      if(d>0 && (next>max || next>rem)){ toast('Limit reached for this tier'); return; }
      qty[id]=next; document.getElementById('q_'+id).value=next; recalc();
    }
    function recalc(){
      let total=0; TYPES.forEach(t=> total += (qty[t.id]||0)*t.price_etb);
      document.getElementById('total').textContent=money(total);
      document.getElementById('payBtn').disabled = total<=0;
    }

    async function checkout(){
      const items = TYPES.filter(t=>qty[t.id]>0).map(t=>({ticket_type_id:t.id, quantity:qty[t.id]}));
      const body = {
        event_id: EVENT.id,
        buyer_name: document.getElementById('buyerName').value.trim(),
        buyer_email: document.getElementById('buyerEmail').value.trim(),
        buyer_phone: document.getElementById('buyerPhone').value.trim(),
        items
      };
      if(!body.buyer_name||!body.buyer_email||!body.buyer_phone){ toast('Fill in your details'); return; }
      document.getElementById('payBtn').disabled=true;
      try{
        const orderRes = await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const order = await orderRes.json();
        if(!orderRes.ok){ toast(order.error||'Order failed'); document.getElementById('payBtn').disabled=false; return; }
        const payRes = await fetch('/api/orders/'+order.order.id+'/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gateway:document.getElementById('gateway').value})});
        const pay = await payRes.json();
        if(!payRes.ok){ toast(pay.error||'Payment init failed'); return; }
        // Redirect to gateway checkout (mock in simulation mode).
        window.location.href = pay.checkout_url;
      }catch(e){ toast('Network error'); document.getElementById('payBtn').disabled=false; }
    }

    const params=new URLSearchParams(location.search);
    if(params.get('event')) load(params.get('event'));
  </script>
</body>
</html>
